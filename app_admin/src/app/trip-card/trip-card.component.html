<div class="card">
  <div class="card-header">{{ trip.name }}</div>
  <img src="assets/images/{{ trip.image }}" alt="trip thumbnail" class="card-img-top">
  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>
    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} only {{ trip.perPerson }} per person
    </p>
    <p class="card-text" [innerHTML]="trip.description"></p>
    <button type="button" class="btn btn-info" *ngIf="isLoggedIn()" (click)="editTrip(trip)">Edit Trip</button>
    <button type="button" class="btn btn-danger ms-2" *ngIf="isLoggedIn()" (click)="deleteTrip(trip)">Delete</button>
  </div>
</div>
