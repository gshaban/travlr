<div class="col-md-4">
  <h2 class="text-center">Edit Trip</h2>
  <form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="edit-code">Code:</label>
      <input type="text" id="edit-code" formControlName="code" placeholder="Code" class="form-control" readonly [ngClass]="{ 'is-invalid': submitted && f['code'].errors }">
      <div *ngIf="submitted && f['code'].errors">Trip Code is required</div>
    </div>

    <div class="form-group">
      <label for="edit-name">Name:</label>
      <input type="text" id="edit-name" formControlName="name" placeholder="Name" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
      <div *ngIf="submitted && f['name'].errors">Name is required</div>
    </div>

    <div class="form-group">
      <label for="edit-length">Length:</label>
      <input type="text" id="edit-length" formControlName="length" placeholder="Length" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['length'].errors }">
      <div *ngIf="submitted && f['length'].errors">Length is required</div>
    </div>

    <div class="form-group">
      <label for="edit-start">Start:</label>
      <input type="date" id="edit-start" formControlName="start" placeholder="Start" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['start'].errors }">
      <div *ngIf="submitted && f['start'].errors">Date is required</div>
    </div>

    <div class="form-group">
      <label for="edit-resort">Resort:</label>
      <input type="text" id="edit-resort" formControlName="resort" placeholder="Resort" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }">
      <div *ngIf="submitted && f['resort'].errors">Resort is required</div>
    </div>

    <div class="form-group">
      <label for="edit-per-person">Per Person:</label>
      <input type="text" id="edit-per-person" formControlName="perPerson" placeholder="Perperson" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }">
      <div *ngIf="submitted && f['perPerson'].errors">Per Person is required</div>
    </div>

    <div class="form-group">
      <label for="edit-image">Image Name:</label>
      <input type="text" id="edit-image" formControlName="image" placeholder="Image" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['image'].errors }">
      <div *ngIf="submitted && f['image'].errors">Image Name is required</div>
    </div>

    <div class="form-group">
      <label for="edit-description">Description:</label>
      <input type="text" id="edit-description" formControlName="description" placeholder="Description" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['description'].errors }">
      <div *ngIf="submitted && f['description'].errors">Description is required</div>
    </div>

    <button type="submit" class="btn btn-info mt-3">Save</button>
    <button type="button" class="btn btn-secondary mt-3 ms-2" (click)="cancel()">Cancel</button>
  </form>
</div>
